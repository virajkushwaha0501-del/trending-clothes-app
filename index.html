<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trending Clothes & Local Rates</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f8fafc; color: #1e293b; padding-bottom: 30px; }
        header { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; padding: 20px 15px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        header h1 { font-size: 20px; font-weight: 700; margin-bottom: 5px; }
        header p { font-size: 13px; opacity: 0.9; }
        .filter-card { background: white; margin: 15px; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 5px; text-transform: uppercase; }
        select, input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; background: #fff; outline: none; }
        .btn-search { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .container { padding: 0 15px; }
        .results-header { font-size: 15px; font-weight: 700; color: #334155; margin: 15px 0 10px 0; }
        .clothes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
        .cloth-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .cloth-card img { width: 100%; height: 160px; object-fit: cover; }
        .card-body { padding: 10px; }
        .cloth-title { font-size: 13px; font-weight: 600; color: #0f172a; margin-bottom: 4px; height: 36px; overflow: hidden; }
        .cloth-market { font-size: 11px; color: #64748b; margin-bottom: 6px; }
        .cloth-price { font-size: 14px; font-weight: 700; color: #16a34a; }
        .no-data { text-align: center; padding: 30px 15px; color: #64748b; font-size: 14px; grid-column: 1/-1; }
    </style>
</head>
<body>

    <header>
        <h1>🔥 Trending Clothes Finder</h1>
        <p>अपने शहर का लेटेस्ट फैशन और लोकल रेट्स जाने</p>
    </header>

    <div class="filter-card">
        <div class="form-group">
            <label>शहर / लोकेशन</label>
            <select id="locationSelect">
                <option value="Mumbai">Mumbai</option>
                <option value="Churchgate">Churchgate</option>
                <option value="Palghar">Palghar</option>
                <option value="Nallasopara">Nallasopara</option>
                <option value="Vasai">Vasai</option>
                <option value="Boisar">Boisar</option>
                <option value="Dahanu">Dahanu</option>
                <option value="Pune">Pune</option>
            </select>
        </div>

        <div class="form-group">
            <label>कैटेगरी</label>
            <select id="categorySelect">
                <option value="all">All Categories</option>
                <option value="men">Men</option>
                <option value="women">Women</option>
                <option value="kids">Kids</option>
            </select>
        </div>

        <button class="btn-search" onclick="loadTrends()">ट्रेंड्स खोजें (Search)</button>
    </div>

    <div class="container">
        <div class="results-header" id="resultsTitle">Trending Outfits</div>
        <div class="clothes-grid" id="clothesGrid"></div>
    </div>

    <script>
        const defaultData = [
            { location: "Vasai", name: "Oversized Printed Tee", category: "men", price: "350", market: "Station Road Market", image: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500" },
            { location: "Churchgate", name: "Crochet Top & Linen Pants", category: "women", price: "550", market: "Fashion Street", image: "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=500" },
            { location: "Nallasopara", name: "Baggy Cargo Pants", category: "men", price: "600", market: "East Market", image: "https://images.unsplash.com/photo-1517445312882-bc9910d016b7?w=500" },
            { location: "Palghar", name: "Cotton Casual Kurti", category: "women", price: "400", market: "Main Bazaar", image: "https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?w=500" }
        ];

        function loadTrends() {
            const loc = document.getElementById('locationSelect').value;
            const cat = document.getElementById('categorySelect').value;
            
            const adminData = JSON.parse(localStorage.getItem('trendingClothes')) || [];
            const allData = [...adminData, ...defaultData];

            const filtered = allData.filter(item => {
                const matchLoc = item.location.toLowerCase() === loc.toLowerCase();
                const matchCat = cat === 'all' || item.category.toLowerCase() === cat.toLowerCase();
                return matchLoc && matchCat;
            });

            const grid = document.getElementById('clothesGrid');
            document.getElementById('resultsTitle').innerText = `${loc} में आज का ट्रेंडing फैशन:`;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="no-data">इस लोकेशन के लिए अभी कोई डेटा उपलब्ध नहीं है। Admin Panel से नया डेटा जोड़ें!</div>`;
                return;
            }

            grid.innerHTML = filtered.map(item => `
                <div class="cloth-card">
                    <img src="${item.image}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/150?text=Fashion'">
                    <div class="card-body">
                        <div class="cloth-title">${item.name}</div>
                        <div class="cloth-market">📍 ${item.market}</div>
                        <div class="cloth-price">Avg ₹${item.price}</div>
                    </div>
                </div>
            `).join('');
        }

        window.onload = loadTrends;
    </script>
</body>
</html>
