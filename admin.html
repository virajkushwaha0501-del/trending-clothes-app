<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Trending Clothes</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f0f2f5; padding: 15px; }
        .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; }
        h2 { text-align: center; color: #1e293b; margin-bottom: 15px; }
        label { display: block; margin-top: 10px; font-weight: bold; color: #475569; font-size: 14px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
        button { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; margin-top: 20px; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .msg { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; text-align: center; }
        .success { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🛠️ Admin Panel</h2>
        <form id="clothForm">
            <label>शहर / लोकेशन (City/Location)</label>
            <select id="location" required>
                <option value="Mumbai">Mumbai</option>
                <option value="Churchgate">Churchgate</option>
                <option value="Palghar">Palghar</option>
                <option value="Nallasopara">Nallasopara</option>
                <option value="Vasai">Vasai</option>
                <option value="Boisar">Boisar</option>
                <option value="Dahanu">Dahanu</option>
                <option value="Pune">Pune</option>
            </select>

            <label>कपड़े का नाम (Cloth Name)</label>
            <input type="text" id="name" placeholder="उदा. Oversized Graphic T-Shirt" required>

            <label>कैटेगरी (Category)</label>
            <select id="category">
                <option value="men">Men</option>
                <option value="women">Women</option>
                <option value="kids">Kids</option>
            </select>

            <label>औसत रेट ₹ (Avg Rate)</label>
            <input type="number" id="price" placeholder="450" required>

            <label>मार्केट की जगह (Market Name)</label>
            <input type="text" id="market" placeholder="उदा. Station Market / Fashion Street" required>

            <label>फोटो का Link (Image URL)</label>
            <input type="url" id="image" placeholder="https://..." required>

            <button type="submit">डेटा जोड़ें (Add Trend)</button>
        </form>

        <div id="statusMsg" class="msg success">डेटा सफलतापूर्वक जोड़ दिया गया!</div>
    </div>

    <script>
        document.getElementById('clothForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newCloth = {
                location: document.getElementById('location').value,
                name: document.getElementById('name').value,
                category: document.getElementById('category').value,
                price: document.getElementById('price').value,
                market: document.getElementById('market').value,
                image: document.getElementById('image').value,
                date: new Date().toISOString().split('T')[0]
            };

            let existingData = JSON.parse(localStorage.getItem('trendingClothes')) || [];
            existingData.push(newCloth);
            localStorage.setItem('trendingClothes', JSON.stringify(existingData));

            const msg = document.getElementById('statusMsg');
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 3000);

            document.getElementById('clothForm').reset();
        });
    </script>
</body>
</html>
